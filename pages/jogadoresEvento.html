<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogadores do Evento</title>

    <link rel="stylesheet" href="../style/jogadoresEvento.css">
</head>

<body>

    <div class="container">
        <a href="eventos.html">Voltar</a>
        <h1>Jogadores do Evento<span id="esporte"></span></h1>

        <div class="evento">
            <h2>Evento: <span id="nomeEvento"></span></h2>
            <p id="infoEvento">Inscreva os atletas participantes deste evento.</p>
        </div>

        <div class="formulario">

            <!-- O jogador e um atleta ja cadastrado no banco:
                as opcoes vem da tabela atleta, pelo jogador_opcoes.php -->
            <select id="idAtleta">
                <option value="">Selecione o atleta</option>
            </select>

            <select id="situacao">
                <option value="PENDENTE_PAGAMENTO">Pendente de pagamento</option>
                <option value="CONFIRMADA">Confirmada</option>
                <option value="PRESENTE">Presente</option>
                <option value="FALTOU">Faltou</option>
                <option value="CANCELADA">Cancelada</option>
            </select>

            <button id="btn-adicionar" onclick="adicionar()">
                Inscrever jogador
            </button>

        </div>

        <div id="alterar"></div>

    </div>

    <div class="container">
        <h2>Lista de Jogadores</h2>
        <table id="tabela-jogadores">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Posição</th>
                    <th>Situação</th>
                    <th>Inscrito em</th>
                    <th>Opções</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- As linhas sao criadas pelo JavaScript, com os dados
                    que o jogador_get.php leu do MySQL -->
            </tbody>
        </table>
    </div>

    <script src="../js/jogadoresEvento.js"></script>

</body>

</html>
