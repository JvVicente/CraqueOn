<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogadores do Evento</title>

    <link rel="stylesheet" href="../style/jogadoresEvento.css">
</head>

<body>

    <div class="container">

        <h1>Jogadores do Evento<span id="esporte"></span></h1>

        <div class="evento">
            <h2>Evento: <span id="nomeEvento"></span></h2>
            <p>Cadastre os jogadores participantes deste evento.</p>
        </div>

        <div class="formulario">

            <input type="text" id="nome" placeholder="Nome do jogador">

            <input type="number" id="idade" placeholder="Idade">

            <!-- As posicoes sao criadas pelo JavaScript, de acordo com o esporte do evento -->
            <select id="posicao">
                <option value="">Selecione a posição</option>
            </select>

            <button id="btn-adicionar" onclick="adicionar()">
                Adicionar jogador
            </button>

        </div>

        <div id="alterar"></div>

    </div>
    <div class="container">
        <h2>Lista de Jogadores</h2>
        <table id="tabela-jogadores">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Posição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- As linhas sao criadas pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="../js/jogadoresEvento.js"></script>

</body>

</html>
